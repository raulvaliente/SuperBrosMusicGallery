<div class="container">
  <h2>Nuevo CD</h2>

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <div class="campo">
      <label>Título</label>
      <input formControlName="titulo" type="text" placeholder="Título del CD"/>
      @if (form.get('titulo')?.invalid && form.get('titulo')?.touched) {
        <span class="error">El título es obligatorio</span>
      }
    </div>

    <div class="campo">
      <label>Artista</label>
      <input formControlName="artista" type="text" placeholder="Nombre del artista"/>
    </div>

    <div class="campo">
      <label>Género</label>
      <input formControlName="genero" type="text" placeholder="Rock, Pop, Jazz..."/>
    </div>

    <div class="campo">
      <label>Precio (€)</label>
      <input formControlName="precio" type="number" placeholder="0.00"/>
    </div>

    <div class="campo">
      <label>Año</label>
      <input formControlName="anio" type="number" placeholder="2024"/>
    </div>

    <div class="campo">
      <label for="tiendaId">Tienda</label>
  <select id="tiendaId" formControlName="tiendaId">
    <option [ngValue]="null" disabled>Selecciona una tienda</option>
    @for (tienda of tiendas(); track tienda.id) {
      <option [value]="tienda.id">{{ tienda.nombre }}</option>
    }
  </select>
      @if (form.get('tiendaId')?.invalid && form.get('tiendaId')?.touched) {
        <span class="error">Selecciona una tienda</span>
      }
    </div>

    <div class="botones">
      <button type="submit" [disabled]="form.invalid" class="btn-guardar">Guardar</button>
      <a routerLink="/cds" class="btn-cancelar">Cancelar</a>
    </div>
  </form>
</div>
